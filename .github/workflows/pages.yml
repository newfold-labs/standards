name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run has nothing useful left to say, but never cancel a deploy
# that is already partway through publishing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate front matter and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

  build:
    name: Build site
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The scorecard is swept on a schedule and published to its own branch,
      # because the default branch requires a pull request and a nightly job
      # cannot open one. Main carries a committed snapshot so the board renders
      # for a fresh clone and in pull requests; when the data branch exists it is
      # newer, so it wins.
      - name: Take the latest sweep
        run: |
          if git fetch --depth 1 origin scorecard-data 2>/dev/null; then
            git checkout FETCH_HEAD -- _data scorecard
            echo "Building against the latest sweep."
          else
            echo "No sweep published yet; building against the snapshot on main."
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
