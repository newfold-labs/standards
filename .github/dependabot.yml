version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    allow:
      - dependency-type: direct
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "dependencies"
      - "workflows"

  # Maintain dependencies for npm (the validation tooling under scripts/)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    allow:
      - dependency-type: direct
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "npm"
      prefix-development: "npm Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
