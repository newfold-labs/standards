version: 2

# One pull request per ecosystem per week rather than one per dependency.
# Grouping keeps CI cost flat and avoids the conflict cascade where several
# open bumps each invalidate the others' lockfile the moment one of them merges.
# It is also what makes the scheduled auto-merge sweep worth having: a single
# green PR to sweep instead of a queue that has to be rebased in order.
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    allow:
      - dependency-type: direct
    groups:
      actions-all:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "dependencies"
      - "workflows"

  # Maintain dependencies for npm (the validation tooling under scripts/)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    allow:
      - dependency-type: direct
    groups:
      npm-all:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "npm"
      prefix-development: "npm Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  # Maintain dependencies for Bundler (Jekyll and the plugins the site declares)
  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "main"
    allow:
      - dependency-type: direct
    groups:
      bundler-all:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "Bundler"
      include: "scope"
    labels:
      - "dependencies"
      - "ruby"
