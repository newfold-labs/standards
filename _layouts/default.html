<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#EC5328">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <a href="{{ '/' | relative_url }}">
        <h1 class="project-name">{{ site.title }}</h1>
      </a>
      <h2 class="project-tagline">{{ page.summary | default: site.description }}</h2>
      <a href="{{ site.repository_url }}" class="btn">View on GitHub</a>
    </header>

    <div class="page-body">
      {% include nav.html %}

      <main id="content" class="main-content" role="main">
        {{ content }}

        <footer class="site-footer">
          <span class="site-footer-owner">
            <a href="{{ site.repository_url }}">standards</a> is maintained by
            <a href="https://github.com/newfold-labs">newfold-labs</a>.
          </span>
          <span class="site-footer-credits">
            Machine-readable index at <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>.
          </span>
        </footer>
      </main>
    </div>
  </body>
</html>
