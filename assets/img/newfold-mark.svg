<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Newfold">
  <title>Newfold</title>
  <!--
    Traced from the brand mark. Four shapes with 180-degree rotational symmetry
    about the centre: two orange strokes crossing, and the two grey arms that
    complete the X. Brand colours are fixed, not themed, so the mark reads the
    same on a light or a dark background.
  -->
