    <path d="M29.5 22.5H98.5L177.5 100L142.5 133.5Z"/>
    <path d="M170.5 177.5H101.5L22.5 100L57.5 66.5Z"/>
  </g>
  <g fill="#939497">
    <path d="M142.5 49.5L183.5 18.5V90.5Z"/>
    <path d="M57.5 150.5L16.5 181.5V109.5Z"/>
  </g>
</svg>
