---
# Copy this file to rules/<id>.yml and fill it in.
# Format reference: meta/rules-format.md

# Unique rule id. This is what a failing check reports.
id: example-rule-id

# The `id` of the standard this enforces. Must be a document with
# `enforceable: true`.
standard: example-standard-id

# What the rule checks, phrased as the passing condition.
title: Describe the state that passes, not the violation

# warning unless the code cannot parse. See meta/rules-format.md.
severity: warning

# phpcs | eslint | structure | ...
engine: phpcs

# Engine-specific payload.
config:
  sniff: Newfold.Category.SniffName

# Same vocabulary as document front matter.
applies_to: [plugin, module]

# The package that ships the check, and the release of it that first did.
# A repository pinned below that version cannot run this rule at all, which is a
# different thing from failing it.
package: newfold-labs/wp-php-standards
introduced_in: 0.0.0
